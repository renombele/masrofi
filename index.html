<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F7B5F">
<title>مصروفي</title>
<style>
:root{--bg:#E6EDEA;--surface:#FFFFFF;--ink:#14302A;--muted:#5D726D;--line:#C9D6D1;--accent:#0F7B5F;--accent-ink:#FFFFFF;--refund:#2C6AA8;--warn:#8A520A;--warn-bg:#FFF1D9;--danger:#B3261E;--ok-bg:#DDF1E8;--new-bg:#E4ECF8;--bad-bg:#FBE3E1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A17;--surface:#162824;--ink:#E3EDE9;--muted:#9AAFA9;--line:#2B443E;--accent:#3DBB92;--accent-ink:#062219;--refund:#80B4E8;--warn:#F2B863;--warn-bg:#382A12;--danger:#F28B82;--ok-bg:#153A2E;--new-bg:#1A2A42;--bad-bg:#3D1C1A}}
:root[data-theme="dark"]{--bg:#0E1A17;--surface:#162824;--ink:#E3EDE9;--muted:#9AAFA9;--line:#2B443E;--accent:#3DBB92;--accent-ink:#062219;--refund:#80B4E8;--warn:#F2B863;--warn-bg:#382A12;--danger:#F28B82;--ok-bg:#153A2E;--new-bg:#1A2A42;--bad-bg:#3D1C1A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.top{max-width:640px;margin:0 auto;padding:14px 18px 2px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tl{display:flex;flex-direction:column}
.ur{display:flex;gap:6px}
.icb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icb:disabled{opacity:.35;cursor:default}
.icb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.filt>summary{cursor:pointer;color:var(--accent);font-weight:600;padding:4px 0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.sumline{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;color:var(--muted);font-size:.92rem}.sumline b{color:var(--ink);font-variant-numeric:tabular-nums}
.top h1{margin:0;font-size:1.55rem;font-weight:800}
.top span{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;padding:4px 12px 24px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;min-width:0;border:0;background:none;color:var(--muted);font:inherit;font-size:.62rem;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.tabs button.on{color:var(--accent);font-weight:700}
.tabs svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
details.block>summary{font-weight:700;cursor:pointer;padding:2px 0}
details.block[open]>summary{margin-bottom:10px}
h2{font-size:1.08rem;margin:0 0 6px}
h3{font-size:.98rem;margin:14px 0 6px}
p{margin:6px 0}
.note{color:var(--muted);font-size:.9rem;margin:2px 0 10px}
.muted{color:var(--muted)}.small{font-size:.82rem;margin-top:6px}
textarea,input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
textarea{min-height:170px;resize:vertical;unicode-bidi:plaintext}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{font-family:inherit;white-space:pre-wrap;unicode-bidi:plaintext;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;margin:8px 0;font-size:.95rem;line-height:1.8}
textarea.msg{min-height:190px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;border-radius:12px;padding:11px 18px;min-height:46px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
a.btn{text-decoration:none}
.btn.small{padding:6px 12px;min-height:38px;font-size:.9rem;font-weight:600}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.actions .btn{flex:1 1 140px}
.link{background:none;border:0;color:var(--accent);font:inherit;font-size:.9rem;padding:6px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--danger)}
.alert{border-radius:12px;padding:10px 12px;margin:12px 0;font-size:.92rem}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.bad{background:var(--bad-bg);color:var(--danger)}
[hidden]{display:none!important}
.fld{display:block;margin:10px 0;font-size:.9rem;color:var(--muted)}
.fld select,.fld input{margin-top:4px;color:var(--ink)}
.fields{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.frow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px;border-radius:10px;border:1px solid var(--line)}
.frow.done{background:var(--ok-bg);border-color:transparent}
.fval{overflow-wrap:anywhere;unicode-bidi:plaintext;font-size:.92rem}
.x{border:0;background:none;color:var(--muted);font-size:1rem;min-width:36px;min-height:36px;cursor:pointer}
.radio{display:flex;align-items:center;gap:8px;padding:8px 0}.radio input{width:auto;min-height:0}
/* الإيصال: العنصر المميز في التطبيق */
.receipt{position:relative;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:16px 16px 22px;margin:12px 0 22px}
.receipt::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-12px;height:12px;background:linear-gradient(135deg,var(--surface) 50%,transparent 50%) 0 0/16px 12px repeat-x,linear-gradient(225deg,var(--surface) 50%,transparent 50%) 0 0/16px 12px repeat-x}
.rtype{text-align:center;font-weight:700;color:var(--muted);font-size:.95rem}
.rtype.refund{color:var(--refund)}
.amtwrap{display:flex;gap:8px;align-items:center;justify-content:center;border-bottom:2px dashed var(--line);padding:6px 0 14px;margin-bottom:6px}
.amt{font-size:2.3rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;max-width:10ch;padding:4px;direction:ltr}
.amt:focus{border-bottom-color:var(--accent)}
.cur{width:auto;min-width:5.5em}
.row{display:grid;grid-template-columns:6.5em 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line)}
.row>span{padding-top:10px;color:var(--muted);font-size:.92rem}
.meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.raw{font-size:.8rem;color:var(--muted);unicode-bidi:plaintext;overflow-wrap:anywhere}
.badge{font-size:.78rem;border-radius:999px;padding:2px 10px;font-weight:600}
.badge.ok{background:var(--ok-bg);color:var(--accent)}.badge.sug{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--danger)}
.badge.new{background:var(--new-bg);color:var(--refund)}
.tx{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;font:inherit;color:inherit;text-align:start;cursor:pointer}
.tx:last-of-type{border-bottom:0}
.tn{display:flex;flex-direction:column;min-width:0}.tn small{color:var(--muted);font-size:.8rem}
.ta{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}.ta.refund{color:var(--refund)}.ta.transfer{color:var(--muted)}
.dhead{font-size:.82rem;color:var(--muted);margin:12px 0 0;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.hero{text-align:center;padding:18px 0 8px}
.big{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.kpis div{background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column}
.kpis b{font-variant-numeric:tabular-nums}.kpis span{color:var(--muted);font-size:.82rem}.kpis .refund{color:var(--refund)}
.bar{margin:10px 0}.bl{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}.bl b{font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:8px;background:var(--bg);border-radius:4px;margin-top:4px;overflow:hidden}.track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end}
.col{display:flex;flex-direction:column;align-items:center;font-size:.72rem;gap:2px}
.cbar{height:110px;width:100%;max-width:34px;display:flex;align-items:flex-end;background:var(--bg);border-radius:6px;overflow:hidden}.cbar i{display:block;width:100%;background:var(--accent)}
.col b{font-variant-numeric:tabular-nums}.col span{color:var(--muted)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.item{padding:10px 0;border-bottom:1px solid var(--line)}.item:last-of-type{border-bottom:0}
.ih{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.clrf{margin-inline-start:12px;border:1px solid var(--line);background:var(--surface);color:var(--danger);
  border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:400;font-family:inherit;cursor:pointer;
  vertical-align:middle;white-space:nowrap}
.clrf:active{background:var(--bad-bg)}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 4px 0 10px;margin:3px 0 3px 6px;font-size:.85rem;unicode-bidi:plaintext;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;min-width:30px;min-height:30px}
.ac{position:relative}
.seg.small button{font-size:.82rem;padding:8px 6px}
.kv.picked{background:var(--bad-bg);border-radius:8px}
.pickcard{border-radius:10px;border:1px solid var(--line);margin:4px 0}
.pickcard.on{border-color:var(--accent);background:var(--ok-bg);color:var(--accent)}
.selbar{margin-top:12px;padding:12px;border:1px dashed var(--danger);border-radius:12px}
.selbar b{color:var(--danger)}
.block.picked{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.pick{display:inline-flex;align-items:center;margin-inline-end:6px}
.pick input{width:20px;height:20px;accent-color:var(--danger)}
.lock{display:none;position:fixed;inset:0;background:var(--bg);z-index:30;align-items:center;justify-content:center;padding:24px}
.lock.on{display:flex}
.lockbox{width:100%;max-width:340px;text-align:center}
.lockbox h1{margin:0 0 4px;font-size:1.6rem}
.lockbox input{width:100%;text-align:center;font-size:1.3rem;letter-spacing:.2em;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-family:inherit}
.lockbox .actions{justify-content:center}
.note.bad{color:var(--danger)}
.acbox{display:none;position:absolute;top:calc(100% + 4px);inset-inline:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(20,48,42,.18);z-index:6;overflow:hidden}
.acbox.on{display:block}
.achd{font-size:.78rem;color:var(--muted);padding:8px 12px 2px}
.aci{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:inherit;padding:10px 12px;min-height:46px;text-align:start;cursor:pointer}
.aci:first-of-type{border-top:0}.aci small{color:var(--muted);font-size:.8rem}
.extras{display:flex;gap:10px;padding:12px 0 2px}
.icx{width:48px;height:48px;border-radius:14px;border:1.5px dashed var(--line);background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.icx svg,.xi svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.xbox{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:8px 10px;margin-top:10px}
.xbox.col{flex-direction:column;align-items:stretch}
.xrow{display:flex;align-items:center;gap:8px}.xrow b{flex:1}
.xi{color:var(--accent);display:grid}
.xbox a{flex:1;color:var(--accent);font-size:.92rem}
.notearea{min-height:80px}
.tn small.xn{color:var(--accent)}
.tn small.xn.part{color:var(--warn);font-weight:600}
.prow{display:flex;align-items:center;gap:4px}.prow .tx{flex:1}
.pick{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.pick input{width:22px;height:22px;min-height:0;flex:none}.pick .tn{flex:1}
.warnt{color:var(--warn)}
.sticky{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.th{width:72px;height:72px;border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;background:var(--bg);cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.viewer{display:none;position:fixed;inset:0;background:rgba(6,20,17,.94);z-index:20;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}
.viewer.on{display:flex}
.vtop{display:flex;justify-content:space-between;align-items:center;color:#fff;gap:10px}
.vtop .link.danger{color:#F6A39C}
.vimg{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;margin:10px 0}
.vimg img{max-width:100%;height:auto}
.vnav{display:flex;gap:10px}.vnav .btn{flex:1;color:#fff;border-color:#fff}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 12px;margin:12px 0 0}
.searchbar:focus-within{border-color:var(--accent)}
.searchbar svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.searchbar input{border:0;background:none;padding:12px 0;min-height:48px}
.searchbar input:focus-visible{outline:none}
.limitbar{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;margin:12px 0}
.limitbar.over{background:var(--bad-bg);color:var(--danger)}
.limitbar .lt{font-size:.9rem;font-weight:600}
.limitbar .track{height:8px;background:rgba(0,0,0,.08);border-radius:4px;margin-top:6px;overflow:hidden}
.limitbar .track i{display:block;height:100%;background:currentColor;border-radius:4px}
.alert.info{background:var(--new-bg);color:var(--refund)}
.chipsrow{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0}
.chipsrow .chip{margin:0}
.chip.on{background:var(--ok-bg);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.add{background:none;color:var(--muted);cursor:pointer;padding:4px 12px;font:inherit;font-size:.85rem;min-height:36px}
.chip.ex{background:var(--bad-bg);border-color:var(--danger);color:var(--danger);font-weight:600;text-decoration:line-through}
.chipsrow .chip{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chipsrow .chip.held{transform:scale(.94);opacity:.75}
.pcol{flex:1;min-width:0}
.pnote{background:var(--bg);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.92rem;white-space:pre-wrap}
.pshare{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 2px 8px}
.cmpsum{font-size:.85rem;color:var(--muted);margin:8px 0;display:flex;flex-direction:column;gap:2px}
table.cmpt{width:100%;border-collapse:collapse;font-size:.9rem}
table.cmpt th{background:var(--bg);text-align:start;padding:8px;color:var(--muted);font-weight:600}
table.cmpt td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.cmpt .num{text-align:end}
b.up{color:var(--danger)}b.down{color:var(--accent)}
#shR{width:100%;padding:0;min-height:36px}
.dhead{font-size:.95rem;color:var(--accent);font-weight:800;margin:16px 0 4px;padding-top:6px;border-top:1px solid var(--line)}
.segb{border-radius:12px;padding:6px 10px 2px;margin:10px 0}
.segb.s0{background:var(--ok-bg)}.segb.s1{background:var(--new-bg)}.segb.s2{background:var(--warn-bg)}
.segn{font-size:.8rem;font-weight:700;opacity:.8}
.segw{font-size:.82rem;color:var(--danger);font-weight:600;padding:0 2px 8px}
.segb .msg{background:var(--surface);border-style:solid}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.linkbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.linkbox b{font-size:.95rem}
.msheet .opt.samem{border-color:var(--accent);background:var(--ok-bg)}
.dsum{color:var(--accent);font-variant-numeric:tabular-nums}
.itemc{border:1px solid var(--line);border-radius:12px;padding:8px;margin:8px 0}
.irow1{display:grid;grid-template-columns:auto auto 1fr auto;gap:6px;align-items:center}
.disc{display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.disc input{width:20px;height:20px;min-height:0;margin:0}
.irow2{display:grid;grid-template-columns:3.2em 1fr 1fr auto;gap:6px;align-items:end;margin-top:6px}
.irow2 label{display:flex;flex-direction:column;font-size:.72rem;color:var(--muted);gap:2px}
.irow2 input{padding:7px;min-height:38px;font-size:.92rem}
.rest{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:9px;font:inherit;font-size:.75rem;padding:0 8px;min-height:38px;cursor:pointer;white-space:nowrap}
.pr .chip{font-size:8.5pt}
.item3{display:grid;grid-template-columns:1fr 3.4em 4.8em auto;gap:6px;align-items:center;margin:6px 0}
.item3 input{padding:8px;min-height:40px;font-size:.92rem}
.remain{font-size:.86rem;color:var(--muted);padding-top:6px}
.dots{border:0;background:none;color:var(--muted);font-size:1.15rem;line-height:1;min-width:30px;min-height:34px;cursor:pointer;padding:0}
.irow3{margin-top:6px}
.irow3 label{display:flex;flex-direction:column;font-size:.72rem;color:var(--muted);gap:2px}
.irow3 select{min-height:40px;padding:7px;font-size:.92rem}
.hid{display:inline-block;min-width:3.2em;text-align:center;letter-spacing:.12em;color:var(--muted);background:var(--bg);border-radius:8px;padding:0 8px;cursor:pointer;-webkit-user-select:none;user-select:none;font-weight:700}
.hid.shown{letter-spacing:normal;color:inherit;background:none;padding:0}
.ta .hid{min-width:3.6em}
.splitnote{margin-top:8px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:.85rem;font-weight:600;line-height:1.7}
.remain.bad{color:var(--danger);font-weight:600}
.msg.sel{user-select:text;-webkit-user-select:text;cursor:text}
.msg .mk{border-radius:4px;padding:1px 2px;font-weight:700}
.f-amount .mk,.mk.f-amount{background:#CDEBDD;color:#0B5B44}
.mk.f-merchant{background:#D8E4FA;color:#1F4E91}
.mk.f-method{background:#EADDF7;color:#5B3A86}
.mk.f-date{background:#FBE6C7;color:#7A4E07}
.mk.f-time{background:#CFEBEA;color:#0F5C59}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mk.f-amount{background:#12503C;color:#9FE7C9}:root:not([data-theme="light"]) .mk.f-merchant{background:#1D3B63;color:#B7D2F7}

<script>
'use strict';
/* ================= المنطق: تنظيف النص، القوالب، المطابقة ================= */
const NM={'أ':'ا','إ':'ا','آ':'ا','ٱ':'ا','ة':'ه','ى':'ي','ؤ':'و','ئ':'ي','٫':'.','٬':',','،':','};
'٠١٢٣٤٥٦٧٨٩'.split('').forEach((c,i)=>NM[c]=String(i));
'۰۱۲۳۴۵۶۷۸۹'.split('').forEach((c,i)=>NM[c]=String(i));
/* توحيد الحروف بدون تغيير طول النص (حرف مقابل حرف) عشان مواقع النص تبقى صحيحة */
function norm(s){s=String(s??'');let o='';for(let i=0;i<s.length;i++){const c=s[i];const m=NM[c];if(m!==undefined)o+=m;else{const l=c.toLowerCase();o+=l.length===1?l:c;}}return o;}
const p2=n=>String(n).padStart(2,'0');
function isoDate(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function hhmm(d){return p2(d.getHours())+':'+p2(d.getMinutes());}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function cleanText(t){return String(t||'').replace(/\r\n?/g,'\n').replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,'').trim();}
function nonEmptyLines(t){return t.split('\n').filter(l=>l.trim());}
function firstLine(t){return nonEmptyLines(t)[0]||'';}
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
function esc(s){return s.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&');}

const CUR_RE='(?:sar|sr|usd|eur|aed|gbp|kwd|bhd|qar|omr|egp|ريال|ر\\.س|دولار|يورو|درهم)';
/* يحوّل نص ثابت (مثل "مبلغ:SAR") إلى نمط مرن: الأرقام أي أرقام، المسافات مرنة، العملة أي عملة */
function pat(s){s=norm(s).trim();let out='';const re=/(\d[\d,.]*)|(\s+)|(sar|sr|usd|eur|aed|gbp|kwd|bhd|qar|omr|egp|ريال|ر\.س|دولار|يورو|درهم)|([\s\S])/g;let m;
  while((m=re.exec(s))){if(m[1]!==undefined)out+='[\\d,.]+';else if(m[2]!==undefined)out+='\\s*';else if(m[3]!==undefined)out+=CUR_RE;else out+=esc(m[4]);}
  return out;}

/* ---------- تعليم القالب: من الأجزاء اللي حددها المستخدم ---------- */
function lineTable(text){const arr=[];let pos=0,ne=0;for(const l of text.split('\n')){const empty=!l.trim();arr.push({start:pos,end:pos+l.length,idx:empty?-1:ne});if(!empty)ne++;pos+=l.length+1;}return arr;}
function computeDefs(text,sel){
  const L=lineTable(text);const defs={};
  const ranges=Object.entries(sel).filter(([,r])=>r&&r.e>r.s);
  for(const [f,r] of ranges){
    const ln=L.find(l=>r.s>=l.start&&r.s<=l.end);if(!ln||ln.idx<0)continue;
    const e=Math.min(r.e,ln.end);let ps=ln.start,se=ln.end;
    for(const [g,o] of ranges){if(g===f)continue;if(o.s>=ln.start&&o.s<=ln.end){const oe=Math.min(o.e,ln.end);if(oe<=r.s&&oe>ps)ps=oe;if(o.s>=e&&o.s<se)se=o.s;}}
    const preTxt=text.slice(ps,r.s).trim(),sufTxt=text.slice(e,se).trim();
    const preTok=preTxt?preTxt.split(/\s+/):[];const sufTok=sufTxt?sufTxt.split(/\s+/):[];
    defs[f]={pre:norm(preTok.slice(-2).join(' ')),suf:norm(sufTok.slice(0,2).join(' ')),line:ln.idx,
      anchor:ps===ln.start&&preTok.length<=2};
  }
  return defs;}
function fieldRe(d){
  if(!d.pre&&!d.suf)return null;
  let p=d.pre?(d.anchor?'^\\s*':'')+pat(d.pre)+'\\s*':'^\\s*';
  p+='(.+?)';p+=d.suf?'\\s*'+pat(d.suf):'\\s*$';
  try{return new RegExp(p,'id');}catch(e){return null;}}
function findField(d,lines,nl){
  const re=fieldRe(d);
  if(re){let best=null,bd=1e9;nl.forEach((l,i)=>{const m=re.exec(l);if(m&&m.indices&&m.indices[1]){const dist=Math.abs(i-d.line);if(dist<bd){bd=dist;best=lines[i].slice(m.indices[1][0],m.indices[1][1]).trim();}}});return {v:best,byLabel:true};}
  const l=lines[d.line];return {v:l?l.trim():null,byLabel:false};}
/* مواقع القيم داخل النص، عشان التصحيح يبدأ بالتحديد الحالي بدل ما تعيده من الصفر */
function nonEmptyLineSpans(text){const out=[];let pos=0;for(const l of text.split('\n')){if(l.trim())out.push({text:l,start:pos});pos+=l.length+1;}return out;}
function extractPos(t,text){
  const sp=nonEmptyLineSpans(text);const lines=sp.map(o=>o.text);const nl=lines.map(norm);const out={};
  const trim=(raw,s,e,off)=>{while(s<e&&/\s/.test(raw[s]))s++;while(e>s&&/\s/.test(raw[e-1]))e--;return {s:off+s,e:off+e};};
  for(const [f,d] of Object.entries(t.fields)){const re=fieldRe(d);
    if(re){let best=null,bd=1e9;
      nl.forEach((l,i)=>{const m=re.exec(l);if(m&&m.indices&&m.indices[1]){const dist=Math.abs(i-d.line);
        if(dist<bd){bd=dist;best=trim(lines[i],m.indices[1][0],m.indices[1][1],sp[i].start);}}});
      if(best)out[f]=best;}
    else if(sp[d.line])out[f]=trim(sp[d.line].text,0,sp[d.line].text.length,sp[d.line].start);}
  return out;}
function extractWith(t,text){
  const lines=nonEmptyLines(text),nl=lines.map(norm);const out={};let hits=0;
  for(const [f,d] of Object.entries(t.fields)){const r=findField(d,lines,nl);if(r.v){out[f]=r.v;if(r.byLabel)hits++;}}
  return {out,hits};}

/* ---------- قراءة القيم ---------- */
const CURS=[['SAR',/(^|[^a-z])s(a)?r([^a-z]|$)|ريال|ر\.س/],['USD',/(^|[^a-z])usd([^a-z]|$)|دولار|\$/],['EUR',/(^|[^a-z])eur([^a-z]|$)|يورو|€/],['AED',/(^|[^a-z])aed([^a-z]|$)|درهم/],['GBP',/(^|[^a-z])gbp([^a-z]|$)|£/],['KWD',/(^|[^a-z])kwd([^a-z]|$)/],['BHD',/(^|[^a-z])bhd([^a-z]|$)/],['QAR',/(^|[^a-z])qar([^a-z]|$)/],['OMR',/(^|[^a-z])omr([^a-z]|$)/],['EGP',/(^|[^a-z])egp([^a-z]|$)/]];
function detectCurrency(v){const s=norm(v);for(const [c,re] of CURS)if(re.test(s))return c;return '';}
function parseAmount(v){const s=norm(v);const m=s.match(/(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d+))?/);
  if(!m)return {amount:null,currency:detectCurrency(v)};
  return {amount:parseFloat(m[1].replace(/,/g,'')+(m[2]?'.'+m[2]:'')),currency:detectCurrency(v)};}
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function dateCands(v){
  const s=norm(v);const res=[];
  const add=(o,y,mo,d)=>{y=+y;if(y<100)y+=2000;mo=+mo;d=+d;if(mo>=1&&mo<=12&&d>=1&&d<=31&&y>=2000&&y<=2100)res.push({o,date:y+'-'+p2(mo)+'-'+p2(d)});};
  const m=s.match(/(\d{1,4})[-\/.](\d{1,2})[-\/.](\d{1,4})/);
  if(m){const [a,b,c]=[m[1],m[2],m[3]];
    if(a.length===4)add('YMD',a,b,c);else if(c.length===4){add('DMY',c,b,a);add('MDY',c,a,b);}else{add('YMD',a,b,c);add('DMY',c,b,a);add('MDY',c,a,b);}
    return res;}
  const t=s.match(/(\d{1,2})[\s\-\/]*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[\s\-\/,]*(\d{2,4})/);
  if(t)add('TXT',t[3],MON[t[2]],t[1]);
  return res;}
function parseDate(v,order){const cs=dateCands(v);if(!cs.length)return null;const f=cs.find(c=>c.o===order);return (f||cs[0]).date;}
function parseTime(v){const s=norm(v);const m=s.match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm|صباحا|مساء|ص|م)?(?!\p{L})/u);
  if(!m)return null;let hh=+m[1];const mm=+m[2];const ap=m[3];
  if(ap){const pm=ap==='pm'||ap==='م'||ap==='مساء';if(pm&&hh<12)hh+=12;if(!pm&&hh===12)hh=0;}
  if(hh>23||mm>59)return null;return p2(hh)+':'+p2(mm);}

/* ---------- نوع الرسالة ---------- */
function detectType(n){
  for(const t of ['ignore','refund','transfer','purchase'])
    for(const w of (S.typeWords[t]||[])){const nw=norm(w).trim();if(nw&&n.includes(nw))return {type:t,word:w};}
  return {type:null,word:''};}

/* ---------- المحلات ---------- */
const STOP=new Set(['riyadh','jeddah','jiddah','dammam','khobar','alkhobar','makkah','mecca','madinah','medina','madina','taif','abha','tabuk','qassim','buraidah','hail','jazan','najran','sa','ksa','sau','saudi','arabia','الرياض','جده','الدمام','الخبر','مكه','المدينه','الطايف','ابها','تبوك','القصيم','بريده','حايل','جازان','نجران','السعوديه']);
function cleanMerchant(s){const c=norm(s).replace(/[0-9]/g,' ').replace(/[^\p{L}\s]/gu,' ').split(/\s+/).filter(w=>w&&!STOP.has(w)).join(' ').trim();
  if(c.length>=2)return c;
  /* المستلم مكتوب كرقم حساب أو آيبان فقط: نحتفظ بالأرقام عشان يتميز كل حساب */
  return norm(s).replace(/[^\p{L}\p{N}]/gu,'');}
const squash=s=>s.replace(/\s+/g,'');
/* المطابقة: الاسم الكامل فقط. والاستثناء الوحيد: البنك يكتب الاسم ناقصاً من آخره،
   فنقبل الاسم الأقصر إذا كان بداية الاسم الأطول حرفاً بحرف (ويبقى «مقترح» يحتاج تأكيدك).
   exactOnly للحوالات: مطابقة تامة فقط، لأن أسماء العائلات متشابهة */
function matchMerchant(raw,exactOnly){
  const c=cleanMerchant(raw);if(!c)return {status:'new',clean:c,options:[]};const cs=squash(c);
  /* نفس الاسم في الرسائل ممكن يكون لأكثر من محل، فنرجعهم كلهم ويختار المستخدم */
  const hits=S.merchants.filter(m=>m.raws.concat([cleanMerchant(m.name)]).some(r=>r&&squash(r)===cs));
  if(hits.length)return {status:'exact',merchant:hits[0],options:hits.map(m=>m.id),clean:c};
  if(exactOnly)return {status:'new',clean:c,options:[]};
  let best=null,bl=0;
  for(const m of S.merchants){for(const r of m.raws.concat([cleanMerchant(m.name)])){
    const rs=squash(r||'');if(!rs)continue;
    const short=rs.length<cs.length?rs:cs,long=rs.length<cs.length?cs:rs;
    if(short.length<8)continue;                 /* اسم قصير ما يكفي للحكم */
    if(short.length/long.length<0.6)continue;   /* الفرق كبير، غالباً محل ثاني */
    if(long.indexOf(short)!==0)continue;        /* لازم يكون بداية الاسم بالضبط */
    if(short.length>bl){bl=short.length;best=m;}}}
  if(best)return {status:'suggest',merchant:best,options:[best.id],clean:c};
  return {status:'new',clean:c,options:[]};}

/* ---------- وسائل الدفع ---------- */
function cleanMethod(s){return norm(s).replace(/[0-9*#;:,|]/g,' ').replace(/\s+/g,' ').trim();}
const sq2=s=>norm(s).replace(/[\s\-_]/g,'');
function matchMethod(raw){const cs=sq2(cleanMethod(raw));if(!cs)return null;let best=null,bl=0;
  for(const m of S.methods)for(const syn of m.syns.concat([m.name])){const s=sq2(syn);if(s&&cs.includes(s)&&s.length>bl){bl=s.length;best=m;}}
  return best;}

/* ---------- تحليل رسالة كاملة ---------- */
function analyze(text,force){
  const n=norm(text);const dt=detectType(n);const hash=hashStr(n.replace(/\s+/g,' '));
  const dup=S.txns.find(t=>t.hash===hash)||null;
  if(dt.type==='ignore'&&!force)return {kind:'ignore',text,word:dt.word};
  const type=dt.type==='ignore'?null:dt.type;
  const cands=[];
  for(const t of S.templates){
    if(type&&t.type!==type)continue;
    const r=extractWith(t,text);if(!r.out.amount||parseAmount(r.out.amount).amount==null)continue;
    const bank=S.banks.find(b=>b.id===t.bankId);let score=r.hits*2;
    if(bank)for(const k of bank.keywords||[])if(k&&n.includes(norm(k).trim()))score+=5;
    if(t.first){try{if(new RegExp('^\\s*'+t.first+'\\s*$','i').test(norm(firstLine(text))))score+=3;}catch(e){}}
    if(score>0)cands.push({t,r,score});
  }
  if(!cands.length)return {kind:'teach',text,type,dup};
  cands.sort((a,b)=>b.score-a.score);const best=cands[0];
  const ambiguous=cands.some(c=>c.t.bankId!==best.t.bankId&&c.score===best.score);
  const d=buildDraft(best.t,best.r.out,text,hash);d.dup=dup;d.ambiguous=ambiguous;
  return {kind:'review',draft:d};}
function buildDraft(t,out,text,hash){
  const a=parseAmount(out.amount||'');if(!a.currency)a.currency=detectCurrency(text)||'SAR';
  let date=null,time=null;
  if(out.date){date=parseDate(out.date,t.dateOrder);time=parseTime(out.date);}
  if(out.time)time=parseTime(out.time)||time;
  const now=new Date();const dateFromPaste=!date,timeFromPaste=!time;
  if(!date)date=isoDate(now);if(!time)time=hhmm(now);
  const mraw=(out.merchant||'').trim();const mm=matchMerchant(mraw,t.type==='transfer');
  const methodRaw=(out.method||'').trim();
  let me=methodRaw?matchMethod(methodRaw):null,methodFromText=false;
  /* ما فيه حقل وسيلة دفع، أو ما انعرف: ندوّر عليها في نص الرسالة كامل (مثل «شراء إنترنت») */
  if(!me){const mt=matchMethod(text);if(mt){me=mt;methodFromText=true;}}
  return {id:null,bankId:t.bankId,type:t.type,tplId:t.id,amount:a.amount,currency:a.currency,
    merchantRaw:mraw,merchantClean:mm.clean,merchantStatus:mm.status,merchantName:mm.merchant?mm.merchant.name:mraw,
    matchedId:mm.merchant?mm.merchant.id:'',options:mm.options||[],
    category:mm.merchant?(mm.merchant.category||''):'',methodRaw,methodId:me?me.id:'',methodMatched:!!me,methodFromText,
    date,time,dateFromPaste,timeFromPaste,hash,text,own:!!(mm.merchant&&mm.merchant.own),
    cities:(S.lastCities||[]).slice(),items:[],...cardInfo(t,out,text)};}
/* آخر ٤ أرقام البطاقة: من الحقل المعلَّم إن وُجد، وإلا نبحث عن رقم بعد كلمة بطاقة أو نجمة */
function detectLast4(text){const n=norm(text);
  const res=[/(?:بطاقه|card|مدي|mada|visa|فيزا|ماستر|master)[^\d\n]{0,14}\*?\s*(\d{4})(?!\d)/,/\*+\s*(\d{4})(?!\d)/,/(?:ending|تنتهي)[^\d\n]{0,12}(\d{4})(?!\d)/];
  for(const r of res){const m=n.match(r);if(m)return m[1];}return '';}
function cardInfo(t,out,text){
  if(t.type!=='purchase')return {card:'',last4:''};
  const last4=out.card?norm(out.card).replace(/\D/g,'').slice(-4):detectLast4(text);
  const known=last4&&(S.cards||[]).find(c=>c.bankId===t.bankId&&c.last4===last4);
  return {last4,card:known&&known.type?known.type:((S.lastCards||{})[t.bankId]||'')};}

/* ---- مخزن الصور (IndexedDB): الصور تنحفظ بجودتها الأصلية، والعمليات تحفظ أرقام الصور فقط ---- */
let _db=null;
function idb(){return _db?Promise.resolve(_db):new Promise((res,rej)=>{const r=indexedDB.open('masrofi_images',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('images',{keyPath:'id'});r.onsuccess=()=>{_db=r.result;res(_db);};r.onerror=()=>rej(r.error);});}
function idbReq(mode,fn){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('images',mode);const st=tx.objectStore('images');const out=fn(st);
  tx.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);}));}
const imgPut=rec=>idbReq('readwrite',st=>st.put(rec));
const imgGet=id=>idbReq('readonly',st=>st.get(id));
const imgAll=()=>idbReq('readonly',st=>st.getAll());
const imgDel=id=>idbReq('readwrite',st=>st.delete(id));
const imgClear=()=>idbReq('readwrite',st=>st.clear());
const URLS={};
function hydrateImgs(){document.querySelectorAll('img[data-img]').forEach(el=>{const id=el.dataset.img;
  if(URLS[id]){el.src=URLS[id];return;}imgGet(id).then(r=>{if(r){URLS[id]=URL.createObjectURL(r.blob);el.src=URLS[id];}else el.alt='الصورة غير موجودة';}).catch(()=>{});});}

/* فصل الرسائل: السطر الفاضي أولاً، وإلا نبدأ مقطع جديد عند سطر يبدأ برسالة جديدة */
const RE_AMT=/[\d,]+\.\d{2}|\d[\d,]*\s*(?:sar|sr|ريال|ر\.س|usd|aed)|(?:sar|sr|ريال|ر\.س|usd|aed)\s*[\d,]+/i;

function splitMessages(text){

  DUPDROP=0;

  const lines=t.split('\n');
  const starts=[];
  lines.forEach((l,i)=>{const n=norm(l).trim();
    /* كلمة النوع لازم تكون في أول السطر، عشان ما نقسم عند «بطاقة مسبقة الدفع» */
    if(starters.some(w=>{const j=n.indexOf(w);return j>=0&&j<=3;}))starts.push(i);});

  for(let k=0;k<starts.length;k++){

    segs.push(lines.slice(from,to).join('\n').trim());}

const FLABEL={amount:'المبلغ',merchant:'اسم المحل',method:'وسيلة الدفع',card:'رقم البطاقة',date:'التاريخ',time:'الوقت'};
const RE_DATE=/\d{1,4}[-\/.]\d{1,2}[-\/.]\d{1,4}|\d{1,2}[\s\-]*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[\s\-,]*\d{2,4}/i;

/* اختيار ذكي: ضغطة وحدة على القيمة داخل الرسالة تحددها كاملة */
function smartPick(f,off){
  const text=TEACH.text;const ls=text.lastIndexOf('\n',Math.max(0,off-1))+1;let le=text.indexOf('\n',off);if(le<0)le=text.length;
  const line=text.slice(ls,le);const p=Math.min(Math.max(off-ls,0),line.length);
  const toks=[...line.matchAll(/\S+/g)].map(m=>({t:m[0],s:m.index,e:m.index+m[0].length}));
  if(!toks.length)return null;

    if(!ms.length){const c=toks.find(t=>/\d{4}/.test(t.t)&&!RE_DATE.test(t.t)&&!RE_TIME.test(t.t)&&!/[.,]\d/.test(t.t));if(!c)return null;tk=c;ms=[...tk.t.matchAll(/\d{4,}/g)];}
    const m=ms[ms.length-1];const e=tk.s+m.index+m[0].length;return abs(e-4,e);}
  if(f==='date'){
    let tk=toks[i];if(!RE_DATE.test(tk.t))tk=toks.find(t=>RE_DATE.test(t.t));if(!tk)return null;
    const m=tk.t.match(RE_DATE);let st=tk.s+m.index,en=tk.s+m.index+m[0].length;
    const k=toks.indexOf(tk);const nx=toks[k+1];
    if(nx&&RE_TIME.test(nx.t)){en=nx.e;const nx2=toks[k+2];if(nx2&&/^(ص|م|am|pm|صباحا|مساء)$/i.test(nx2.t))en=nx2.e;}
    return abs(st,en);}
  if(f==='time'){
    let tk=toks[i];if(!RE_TIME.test(tk.t))tk=toks.find(t=>RE_TIME.test(t.t));if(!tk)return null;
    const m=tk.t.match(/\d{1,2}:\d{2}(:\d{2})?/);let en=tk.s+m.index+m[0].length;
    const nx=toks[toks.indexOf(tk)+1];if(nx&&/^(ص|م|am|pm|صباحا|مساء)$/i.test(nx.t))en=nx.e;
    return abs(tk.s+m.index,en);}
  /* المحل ووسيلة الدفع: نوسّع من مكان الضغط ونوقف عند الفواصل، ثم نشيل الكلمات الرابطة والتواريخ والأرقام */
  let a=p,b=p;const stop=c=>':;|,،\t'.includes(c);

  const T=TEACH;

  if(!T.sel.amount||!T.sel.merchant){toast('حدد المبلغ و'+(T.type==='transfer'?'المستلم':'اسم المحل')+' على الأقل');return;}
  if(parseAmount(T.text.slice(T.sel.amount.s,T.sel.amount.e)).amount==null){toast('الجزء المحدد للمبلغ ما فيه رقم');return;}
  if(T.sel.date&&!T.dateOrder){const cs=dateCands(T.text.slice(T.sel.date.s,T.sel.date.e));if(cs.length){toast('اختر التاريخ الصحيح');return;}}
  let bankId=T.bankId;
  if(bankId==='__new'){const ex=S.banks.find(b=>norm(b.name).trim()===norm(T.newBank).trim());
    if(ex)bankId=ex.id;else{const b={id:uid(),name:T.newBank.trim(),keywords:[]};S.banks.push(b);bankId=b.id;}}
  const bank=bankById(bankId);if(T.kw.trim()&&!bank.keywords.includes(T.kw.trim()))bank.keywords.push(T.kw.trim());
  const tpl={id:T.editTplId||uid(),bankId,type:T.type,fields:computeDefs(T.text,T.sel),dateOrder:T.dateOrder,first:pat(norm(firstLine(T.text)))};
  const i=S.templates.findIndex(x=>x.id===tpl.id);if(i>=0)S.templates[i]=tpl;else S.templates.push(tpl);
  save('حفظ صيغة رسائل '+bank.name);
  RETRO=retroCandidates(tpl);
  const r=extractWith(tpl,T.text);const n=norm(T.text);
  DRAFT=buildDraft(tpl,r.out,T.text,hashStr(n.replace(/\s+/g,' ')));DRAFT.dup=T.dup||S.txns.find(t=>t.hash===DRAFT.hash)||null;
  if(DRAFT.id==null&&T.editId){DRAFT.id=T.editId;}
  toast('انحفظت صيغة '+bank.name);go('review');}

function splitNote(D){
  const its=(D.items||[]).filter(i=>i&&i.cat);if(!its.length)return '';
  const amt=+D.amount||0;const m=new Map();let used=0;
  for(const i of its){const v=itTotal(i);if(v<=0)continue;used+=v;m.set(i.cat,(m.get(i.cat)||0)+v);}
  if(!m.size)return '';
  const f=used>amt&&used?amt/used:1;
  const rest=Math.max(0,amt-Math.min(used,amt));
  const parts=[...m].map(([c,v])=>`${h(c)} ${money(v*f)}`).join('، ');
  return `<div class="splitnote">هذي العملية بتنقسم في الإحصائيات والتصفية: ${parts}${rest>0.004?`، والباقي ${money(rest)} تحت تصنيف العملية «${h(D.category||'بدون تصنيف')}»`:''}.</div>`;}

/* يوم راتب شهر معيّن: اللي حدده المستخدم لهذا الشهر، وإلا اليوم الافتراضي */

const salStart=mk=>mk+'-'+String(salDayOf(mk)).padStart(2,'0');
const nextMK=mk=>{const y=+mk.slice(0,4),m=+mk.slice(5,7)-1;const d=new Date(y,m+1,1);return monthKey(isoDate(d));};

/* مدى الدورة: من يوم راتب هذا الشهر إلى اليوم اللي قبل راتب الشهر اللي بعده */

function salCycleOf(date){
  let mk=monthKey(date);
  if(date<salStart(mk))mk=prevMK(mk);
  return mk;}
const salLabel=mk=>{const r=salRange(mk);return 'راتب '+monthLabel(mk)+' ('+dateLabel(r[0])+' – '+dateLabel(r[1])+')';};
const salShort=mk=>'راتب '+monthLabel(mk);
function allCycles(){return [...new Set(S.txns.map(t=>salCycleOf(effDate(t))))].sort().reverse();}
function periodRange(date,period,from){
  const d=new Date(date+'T00:00:00');
  if(period==='all')return from?[from,'9999-12-31']:null;
  if(period==='salary')return salRange(salCycleOf(date));
  if(period==='year')return [d.getFullYear()+'-01-01',d.getFullYear()+'-12-31'];
  if(period==='week'){const s=new Date(d);s.setDate(d.getDate()-d.getDay());const e=new Date(s);e.setDate(s.getDate()+6);return [isoDate(s),isoDate(e)];}
  const y=d.getFullYear(),m=d.getMonth();return [isoDate(new Date(y,m,1)),isoDate(new Date(y,m+1,0))];}
const periodLabel=(date,period,from)=>period==='all'?(from?'تراكمي من '+dateLabel(from):'تراكمي'):period==='year'?('سنة '+date.slice(0,4)):period==='salary'?salShort(salCycleOf(date)):period==='week'?('أسبوع '+dateLabel(periodRange(date,period)[0])):('شهر '+monthLabel(monthKey(date)));
/* مساهمة العملية في الصرف: نفس قواعد الصافي */
function netOf(t){
  if(t.currency&&t.currency!=='SAR')return 0;
  if(t.type==='transfer'){const m=merchantById(t.merchantId);return (m&&m.own)?0:(+t.amount||0);}
  return t.type==='refund'?-(+t.amount||0):(+t.amount||0);}
function catSpend(cat,date,period,excludeId,from){
  const r=periodRange(date,period,from);let sum=0;
  for(const t of S.txns){if(t.id===excludeId)continue;
    if(r&&(t.date<r[0]||t.date>r[1]))continue;
    const part=catSplit(t).find(([c])=>c===cat);if(!part)continue;
    sum+=netOf(t)*part[1];}
  return sum;}
function limitInfo(cat,date,extra,excludeId){
  const L=S.catLimits[cat];if(!L||!L.amount)return null;
  const spent=catSpend(cat,date,L.period,excludeId,L.from)+(extra||0);
  return {cat,limit:L.amount,period:L.period,spent:+spent.toFixed(2),over:spent>L.amount+0.004,label:periodLabel(date,L.period,L.from)};}
function limitBar(info){
  if(!info)return '';
  const pct=Math.min(100,Math.max(0,info.spent/info.limit*100));
  return `<div class="limitbar ${info.over?'over':''}">
  <div class="lt">${info.over?'تخطيت حد':'حد'} ${h(info.cat)} في ${h(info.label)}: <b>${money(info.spent)}</b> من ${money(info.limit)}</div>
  <div class="track"><i style="width:${pct}%"></i></div></div>`;}

function catSplit(t){

/* ---------------- الأسعار ---------------- */
let PQ='',PGKEY='',PENDNAME=null;
const priceKey=n=>norm(n||'').replace(/\s+/g,' ').trim();
/* المنتج اللي اخترت تخليه مستقلاً ياخذ مجموعة لحاله */
const groupKey=r=>r.sep?'sep:'+r.id:priceKey(r.product);
const pRows=()=>S.prices||[];
/* السعر الفعلي للمقارنة: السعر + التوصيل إذا كان غير شامل ومكتوبة قيمته */
const shipCost=r=>r.shipping?0:(+r.ship||0);
/* لو السعر بدون ضريبة وكتب المستخدم نسبتها، نضيفها للمقارنة فقط */
const taxRate=r=>(r.tax===false&&+r.vat>0)?+r.vat:0;
const taxedPrice=r=>+((+r.price||0)*(1+taxRate(r)/100)).toFixed(2);
const taxAdded=r=>taxRate(r)>0;
/* نسبة العرض معلومة فقط، ما تدخل في الترتيب ولا في الإجمالي */
const offPct=r=>(r.offer&&+r.offPct>0&&+r.offPct<100)?+r.offPct:0;
const offAtBuy=r=>offPct(r)>0&&r.offWhen==='at';
/* السعر قبل العرض، إذا كان المكتوب بعد الخصم */
const priceBefore=r=>+((+r.price||0)/(1-offPct(r)/100)).toFixed(2);
/* السعر بعد الخصم، إذا كان الخصم ينزل عند الشراء */
const priceAfter=r=>+((+r.price||0)*(1-offPct(r)/100)).toFixed(2);
function offText(r){
  const pc=offPct(r);if(!pc)return '';
  return offAtBuy(r)
    ? `عرض ${pc}٪ ينزل عند الشراء، فيصير ${money(priceAfter(r),r.currency)}`
    : `عرض ${pc}٪، وكان قبله ${money(priceBefore(r),r.currency)}`;}
const effPrice=r=>taxedPrice(r)+shipCost(r);
const isSAR=r=>!r.currency||r.currency==='SAR';
function priceGroups(){
  const m=new Map();
  for(const r of pRows()){const k=groupKey(r);
    if(!m.has(k))m.set(k,{key:k,name:r.product,rows:[]});
    m.get(k).rows.push(r);}
  for(const g of m.values()){
    /* الأسعار بعملة أجنبية ما تدخل في ترتيب «الأرخص» لين تتحول للريال */
    g.rows.sort((a,b)=>(isSAR(b)-isSAR(a))||(effPrice(a)-effPrice(b)));
    g.sar=g.rows.filter(isSAR);g.fx=g.rows.filter(r=>!isSAR(r));
    g.best=g.sar[0]||g.rows[0];g.updated=Math.max(...g.rows.map(r=>r.updatedAt||r.createdAt||0));}
  return [...m.values()].sort((a,b)=>b.updated-a.updated);}
const priceDelta=r=>{const hs=r.history||[];if(!hs.length)return 0;return (+r.price||0)-(+hs[hs.length-1].price||0);};
function deltaBadge(r){
  const d=priceDelta(r);if(Math.abs(d)<0.004)return '';
  return `<span class="badge ${d<0?'ok':'bad'}">${d<0?'نقص':'زاد'} ${money(Math.abs(d),r.currency)}</span>`;}
/* تغيّر العرض بين آخر تحديث والحالي */
function offerBadge(r){
  const hs=r.history||[];if(!hs.length)return '';
  const was=!!hs[hs.length-1].offer,now=!!r.offer;
  if(was===now)return '';
  return `<span class="badge ${now?'ok':'bad'}">${now?'صار عليه عرض':'انتهى العرض'}</span>`;}
/* ما يشمله السعر: التوصيل والضريبة والعرض */
function priceTags(r){

/* المقارنة: الأرخص مرجع، وكم يحتاج كل متجر خصماً ليصل إليه */
function cmpTable(g){
  const rows=g.sar;if(rows.length<2)return '';
  const base=effPrice(rows[0]);
  let x=`<section class="block"><details><summary>مقارنة مفصّلة بين المتاجر (${rows.length})</summary>
  <p class="note">الترتيب من الأرخص للأغلى بالإجمالي (السعر + الضريبة إذا كتبت نسبتها + التوصيل غير الشامل). «الخصم المطلوب» كم ينقص هذا المتجر ليصير مثل الأرخص، وينفعك لما يكون فيه كود خصم أو خصم بطاقة.</p>
  <table class="cmpt"><tr><th>المتجر</th><th class="num">السعر</th><th class="num">توصيل</th><th class="num">الإجمالي</th><th class="num">الفرق</th><th class="num">الخصم المطلوب</th></tr>`;

function storeSuggest(v){
  const box=$('#pfSbox');if(!box)return;
  const q=norm(v||'').trim();
  if(!q){box.innerHTML='';box.classList.remove('on');return;}
  const names=[...new Set([...pRows().map(x=>x.store),...S.merchants.map(m=>m.name)])].filter(Boolean);
  const res=[];
  for(const n of names){const k=norm(n);let rank=-1;
    if(k.startsWith(q))rank=0;else if(k.split(/\s+/).some(w=>w.startsWith(q)))rank=1;else if(k.includes(q))rank=2;
    if(rank>=0)res.push([rank,n]);}
  res.sort((a,b)=>a[0]-b[0]||a[1].localeCompare(b[1],'ar'));
  if(!res.length||(res.length===1&&norm(res[0][1])===q)){box.innerHTML='';box.classList.remove('on');return;}
  box.innerHTML=res.slice(0,6).map(([,n])=>`<button type="button" class="aci" onpointerdown="event.preventDefault();pickStore('${h(n).replace(/'/g,"\\'")}')">${h(n)}</button>`).join('');

function saveUpdate(id){

function monthStats(k){return calcStats(S.txns.filter(t=>monthKey(effDate(t))===k));}
/* التصنيف في الإحصائيات: لو منتجات العملية مصنفة، ينقسم مبلغها بينها */
function addCatParts(st,t,v){
  for(const [c,r] of catSplit(t)){const key=(c==='__none'?'بدون تصنيف':c);st.byCat[key]=(st.byCat[key]||0)+v*r;}}
function calcStats(list){
  const st={purchases:0,refunds:0,transfers:0,own:0,net:0,count:0,byCat:{},byMer:{},byBank:{},byMethod:{},other:{}};
  const add=(o,key,v)=>{o[key]=(o[key]||0)+v;};
  for(const t of list){st.count++;
    if(t.currency&&t.currency!=='SAR'){const kk=t.currency+' · '+TYPES[t.type];add(st.other,kk,t.amount);continue;}
    const m=merchantById(t.merchantId);const b=bankById(t.bankId);const me=methodById(t.methodId);
    if(t.type==='transfer'){if(m&&m.own){st.own+=t.amount;continue;}
      st.transfers+=t.amount;addCatParts(st,t,t.amount);add(st.byMer,m?m.name:t.merchantRaw,t.amount);
      add(st.byBank,b?b.name:'بنك محذوف',t.amount);if(me)add(st.byMethod,me.name,t.amount);continue;}
    const v=t.type==='refund'?-t.amount:t.amount;
    if(t.type==='refund')st.refunds+=t.amount;else st.purchases+=t.amount;
    addCatParts(st,t,v);add(st.byMer,m?m.name:t.merchantRaw,v);
    add(st.byBank,b?b.name:'بنك محذوف',v);add(st.byMethod,me?me.name:'غير محددة',v);}
  st.net=st.purchases-st.refunds+st.transfers;return st;}
function bars(obj,limit,key){const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,limit||99);if(!e.length)return '<p class="note">لا يوجد.</p>';
  const max=Math.max(...e.map(x=>x[1]),1);
  return e.map(([k,v])=>`<div class="bar"><div class="bl"><span>${h(k)}</span><b>${mon(v,'',key||'stats')}</b></div><div class="track"><i style="width:${Math.max(0,v/max*100)}%"></i></div></div>`).join('');}

function statsAnchor(){
  const F=FILTERS.stats,P=F.period;
  if(P.mode==='range'&&P.to)return monthKey(P.to);
  if(P.mode==='weeks'&&F.weeks.length)return monthKey([...F.weeks].sort().reverse()[0]);
  if(P.mode==='months'&&F.months.length)return [...F.months].sort().reverse()[0];
  const ds=statsRows().map(t=>t.date).sort();
  return ds.length?monthKey(ds[ds.length-1]):monthKey(isoDate(new Date()));}
function monthNet(k){
  const F=FILTERS.stats;const rows=[];
  for(const t of S.txns){if(monthKey(effDate(t))!==k)continue;
    if(!matchFilter(t,F,['months','weeks']))continue;
    const a=adjustRow(t,F);if(a===null)continue;
    rows.push(Math.abs(a-(+t.amount||0))<0.005?t:Object.assign({},t,{amount:a}));}
  return calcStats(rows).net;}

  if(Object.keys(st.other).length)x+=`<section class="block"><h2>عمليات بعملات أخرى</h2><p class="note">غير محسوبة في الأرقام أعلاه.</p>${Object.entries(st.other).map(([k,v])=>`<div class="kv"><span>${h(k)}</span><b>${v.toLocaleString('en-US',{minimumFractionDigits:2})}</b></div>`).join('')}</section>`;
  x+=`<details class="block"><summary>طريقة الحساب</summary>${methodDoc()}</details>`;

function methodDoc(){return `<ol class="doc">
  <li>صافي المصروف للشهر = المشتريات − الاستردادات + التحويلات الصادرة، والشهر يُحدد من تاريخ العملية المكتوب في الرسالة.</li>
  <li>الاسترداد ينخصم من نفس المحل ونفس تصنيفه، وأيضاً من نفس البنك ووسيلة الدفع في جداولهم.</li>
  <li>التحويلات الصادرة تدخل في صافي المصروف، والمستلم يُعامل مثل المحل: يظهر في «أكثر المحلات» وتصنيفه هو اللي تختاره له. ووسيلة دفعها ثابتة باسم «تحويل صادر».</li>
  <li>التحويل لمستلم معلَّم عليه «حسابي» ما ينحسب مصروف، ويظهر مجموعه تحت الأرقام الرئيسية فقط.</li>
  <li>الإيداعات والحوالات الواردة ورسائل رمز التحقق ما تنسجل أصلاً.</li>
  <li>التصنيف محفوظ مع كل عملية. لما تغيّر تصنيف محل من الإعدادات يسألك: العمليات الجاية فقط، أو السابقة والجاية. ولما تختار في مراجعة عملية تصنيف يختلف عن تصنيف المحل يسألك: هذي العملية فقط، أو هذي والجاية، أو كل عمليات المحل.</li>
  <li>العملية المكررة (نفس نص الرسالة) تنحفظ وتنحسب عادي مع تنبيه قبل الحفظ.</li>
  <li>ربط الاسترداد بعملية شراء توثيق فقط وما يغيّر أي رقم. والاسترداد اليدوي (نقدي أو محفظة) يُحسب مثل أي استرداد.</li>
  <li>العمليات بعملة غير الريال تظهر في قسم مستقل وما تنجمع مع الريال.</li>
  <li>إخفاء المبالغ (•••) عرض فقط، وما يغيّر أي حساب.</li>
  <li>رقم «صافي» في تبويب السجل وأرقام تبويب الإحصائيات تُحسب بنفس القواعد أعلاه، على العمليات الظاهرة بعد التصفية والفترة المختارة. ورسم «آخر ستة أشهر» يتجاهل قيد الفترة ويطبّق بقية التصفية.</li>
  <li>المدن والمنتجات وصف إضافي للعملية فقط، وما تغيّر أي رقم في الإحصائيات. مجموع منتجات العملية لا يتجاوز مبلغها، وما يلزم يغطيه كاملاً.</li>
  <li>إذا صنّفت منتجاً داخل العملية بتصنيف خاص، ينقسم مبلغ العملية: كل منتج مصنّف يأخذ قيمته تحت تصنيفه، والباقي يبقى تحت تصنيف العملية. القسمة هذي تسري على «حسب التصنيف» وعلى التصفية بالتصنيف وعلى حدود الصرف، وما تغيّر مبلغ العملية ولا جداول المحلات والبنوك ووسائل الدفع.</li>
  <li>التصفية بالفترة: إما أشهر، أو أسابيع (الأسبوع يبدأ الأحد)، أو من تاريخ إلى تاريخ، والتاريخان داخلان في الحساب.</li>
  <li>مجموع اليوم في السجل يُحسب بنفس قواعد الصافي أعلاه، على عمليات ذلك اليوم الظاهرة بعد التصفية.</li>
  <li>علامة «خصم» على المنتج وصف فقط، والسعر المكتوب هو المدفوع فعلاً، فما تغيّر أي حساب.</li>
  <li>«المجموع» في تبويب المنتجات = مجموع (الكمية × سعر الحبة) للأسطر الظاهرة بعد البحث والشهر.</li>
  <li>مجموع المشروع يُحسب بنفس القواعد أعلاه على عمليات المشروع فقط، بغض النظر عن شهرها. العملية تقدر تنربط بأكثر من مشروع، وعندها مبلغها يُحسب في مجموع كل مشروع منهم، والمشاريع ما تغيّر أرقام الإحصائيات الشهرية.</li>
  <li>تقدر تحدد «جزء من عملية» داخل المشروع، فيُحسب هذا الجزء فقط في مجموع المشروع. الجزء ما يغيّر مبلغ العملية ولا الإحصائيات ولا السجل.</li>
  <li>تبويب الأسعار مستقل تماماً عن المصروف: ما ينحسب في أي رقم في السجل ولا الإحصائيات، لأنه أسعار تتابعها قبل الشراء.</li>
  <li>ترتيب المتاجر و«الأرخص» في الأسعار يعتمد على الإجمالي = السعر + الضريبة + التوصيل. الضريبة تُضاف فقط إذا كان «شامل الضريبة» مطفأً <b>وكتبت نسبتها</b> (السعر × (١ + النسبة ÷ ١٠٠))، وإذا تركت النسبة فاضية فما تُضاف ويُحسب السعر كما هو. والتوصيل يُضاف فقط إذا كان غير شامل وكتبت قيمته، وإذا تركتها فاضية فالإجمالي ناقص وينبهك التطبيق.</li>
  <li>في المقارنة المفصّلة: المرجع هو أرخص إجمالي، و«الفرق» = إجمالي هذا المتجر − إجمالي الأرخص، و«الخصم المطلوب» بالمبلغ هو نفس الفرق، وبالنسبة = الفرق ÷ إجمالي هذا المتجر × ١٠٠ (أي نسبة الخصم على سعر هذا المتجر نفسه، مثل كود خصم ١٥٪).</li>
  <li>السعر بعملة أجنبية يبقى خارج ترتيب «الأرخص» وخارج المقارنة لين تحوله للريال. والتحويل إما مبلغ تكتبه بنفسك أو ضرب في عامل التحويل، وينحفظ أصل المبلغ وعملته، ومع الضرب يُحوَّل التوصيل بنفس العامل.</li>
  <li>«زاد/نقص» على السعر = الفرق بين السعر الحالي وآخر سعر محفوظ في تاريخ المنتج، على السعر المكتوب وحده بدون ضريبة ولا توصيل.</li>
  <li>نسبة العرض معلومة فقط وما تدخل في الترتيب ولا في الإجمالي. إذا قلت «السعر فوق بعد الخصم» يحسب التطبيق السعر قبل العرض = السعر ÷ (١ − النسبة ÷ ١٠٠) ويعرضه للعلم. وإذا قلت «الخصم ينزل عند الشراء» يحسب السعر بعده = السعر × (١ − النسبة ÷ ١٠٠)، ويُنبِّه أسفل المقارنة أن إجمالي هذا المتجر الحقيقي أقل مما يظهر، لأن السعر المكتوب هو قبل الخصم.</li>
  <li>المصروف النقدي تعبّيه بنفسك من الواجهة الرئيسية، ومصدره ثابت «نقدي (كاش)» ما ينحذف ولا يتسمّى، ووسيلته «نقدي». وتصنيفه تختاره بنفسك مثل أي عملية، فما فيه تصنيف اسمه «كاش». وإذا اخترت بطاقة محفوظة صار مصدر العملية هو بنك تلك البطاقة. وينحسب في صافي المصروف وكل الجداول مثل أي عملية شراء.</li>
  <li>«دورة الراتب» فترة تبدأ من يوم الراتب إلى اليوم اللي قبل راتب الشهر اللي بعده، فالدورات متلاصقة بلا فراغ ولا تداخل حتى لو غيّرت يوم شهر واحد. اليوم الافتراضي ٢٧ وتقدر تغيّره، وتقدر تحدد يوم راتب أي شهر (ماضٍ أو قادم) فيسري على ذلك الشهر وحده ويبقى محفوظاً باسمه. واليوم اللي يزيد على أيام الشهر يُضبط لآخر يوم فيه.</li>
  <li>الاسترداد <b>المربوط بعملية شراء</b> يُحسب في مدة الشراء (شهره وأسبوعه ودورة راتبه)، وهذا هو الأصل وتقدر تطفيه من الإعدادات الإضافية. ويظهر في السجل تحت تاريخ الشراء مع شارة تبيّن تاريخ وصوله الحقيقي، فمجموع اليوم ومجموع الشهر يبقيان متفقين. والاسترداد غير المربوط يبقى في تاريخ وصوله دائماً، وما يُلزمك التطبيق بربطه.</li>
  <li>قفل الرقم السري عرض فقط: البيانات ما تنشفّر، فهو يمنع التطفّل العادي ولا يحمي من شخص خبير بالمتصفح. وسؤال الاحتياط طريقتك الوحيدة لو نسيت الرقم.</li>
  <li>كل حذف في التطبيق يسألك «متأكد؟» قبل التنفيذ، وكذلك زرا التراجع والتقدم، ويُذكر في السؤال وش بينحذف أو وش بيرجع بالاسم.</li>
  <li>الحذف في الأسعار على ثلاث درجات، وكلها بالتحديد: «حذف أسعار» فوق يحدد <b>متاجر</b> كاملة، وإذا حددتها كلها فهذا حذف المنتج كامل. و«حذف تسعيرات من هذا المتجر» داخل قائمة تسعيرات المتجر يحدد <b>تسعيرات</b> بعينها من تاريخه ومنها السعر الحالي، وإذا حددتها كلها انحذف ذلك المتجر وحده. وإذا حذفت السعر الحالي صار أحدث سعر باقٍ في التاريخ هو السعر الحالي بتاريخه وحالة عرضه.</li></ol>`;}

  const blob=new Blob(parts,{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='masrofi-backup-'+isoDate(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();
  toast('تم تصدير النسخة'+(n?' مع '+n+' صورة':''));render();}
function importData(f){if(!f)return;toast('جاري قراءة الملف…');const r=new FileReader();r.onload=async()=>{let d;try{d=JSON.parse(r.result);}catch(e){toast('الملف مو نسخة احتياطية صحيحة من مصروفي');return;}
  if(d.format==='masrofi-settings-1'){IMPS=planSettings(d);go('imp');return;}
  const st=d.format==='masrofi-2'?d.state:d;const imgs=d.format==='masrofi-2'?(d.images||[]):[];
  if(!st||!Array.isArray(st.txns)||!Array.isArray(st.templates)){toast('الملف مو نسخة احتياطية صحيحة من مصروفي');return;}
  if(!confirm(`النسخة فيها ${st.txns.length} عملية${imgs.length?' و'+imgs.length+' صورة':''}. استرجاعها يستبدل كل البيانات الحالية. تكمل؟`))return;
  /* ما نمسح الصور القديمة، عشان التراجع يرجّع كل شي كما كان.
     الصور اللي ما لها عملية تنمسح لحالها في المرة الجاية اللي تفتح فيها التطبيق */
  try{for(const im of imgs)await imgPut({id:im.id,blob:b64ToBlob(im.data,im.type),type:im.type,name:im.name,size:im.size,createdAt:im.createdAt});}
  catch(e){toast('تعذّر استرجاع الصور، المساحة ممكن تكون ممتلئة');}
  Object.keys(URLS).forEach(k=>{URL.revokeObjectURL(URLS[k]);delete URLS[k];});
  S=Object.assign(defaults(),st);save('استرجاع نسخة احتياطية');toast('تم الاسترجاع');go('paste');};r.readAsText(f);}
/* ---- نسخة الإعدادات: تصدير ودمج ---- */
const SETGROUPS={
  banks:{label:'البنوك وصيغ رسائلها',count:()=>S.banks.length},

const SETPICK=new Set(Object.keys(SETGROUPS));
/* مستلمو الحوالات أسماء أشخاص وأرقام حسابات، فما تنرسل إلا إذا اخترت */
let SETRECIP=false;
const isRecipient=m=>!!m.own||S.txns.some(t=>t.merchantId===m.id&&t.type==='transfer');
const recipCount=()=>S.merchants.filter(isRecipient).length;

/* المقارنة: وش جديد ووش موجود عندك أصلاً */
let IMPS=null;
/* بصمة الصيغة: نقارن محتواها لا نوعها، عشان البنك الواحد يقدر يكون له أكثر من صيغة شراء */
function tplSig(t){
  const f={};for(const k of Object.keys(t.fields||{}).sort()){const d=t.fields[k];f[k]=[d.pre||'',d.suf||'',d.line,!!d.anchor];}
  return JSON.stringify([t.type,f,t.dateOrder||'',t.first||'']);}
function planSettings(d){
  const plan={groups:[],data:d};
  const norms=x=>norm(x||'').trim();
  if(d.banks){const add=[],skip=[];
    for(const b of d.banks){const ex=S.banks.find(o=>norms(o.name)===norms(b.name));
      if(ex)skip.push({name:b.name,why:'البنك موجود عندك'});else add.push(b.name);}
    const tAdd=[],tSkip=[];
    const seen=new Set();
    for(const t of (d.templates||[])){const ex=S.banks.find(o=>norms(o.name)===norms(t.bank));
      const sig=tplSig(t);
      if(seen.has(norms(t.bank)+'|'+sig))tSkip.push({name:t.bank+' — '+TYPES[t.type],why:'مكررة داخل الملف نفسه'});
      else if(ex&&S.templates.some(o=>o.bankId===ex.id&&tplSig(o)===sig))tSkip.push({name:t.bank+' — '+TYPES[t.type],why:'عندك نفس الصيغة بالضبط'});
      else {tAdd.push(t.bank+' — '+TYPES[t.type]);seen.add(norms(t.bank)+'|'+sig);}}
    plan.groups.push({k:'banks',label:'البنوك',add,skip});
    plan.groups.push({k:'templates',label:'صيغ الرسائل',add:tAdd,skip:tSkip});}
  if(d.merchants){const add=[],skip=[];
    for(const m of d.merchants){const byName=S.merchants.find(o=>norms(o.name)===norms(m.name));
      const byRaw=!byName&&S.merchants.find(o=>o.raws.some(r=>(m.raws||[]).includes(r)));
      if(byName)skip.push({name:m.name,why:'المحل موجود عندك بنفس الاسم'});
      else if(byRaw)skip.push({name:m.name,why:'هذا المحل موجود عندك ومسميه «'+byRaw.name+'»'});
      else add.push(m.name);}
    plan.groups.push({k:'merchants',label:'المحلات',add,skip});}
  if(d.categories){const add=[],skip=[];
    for(const c of d.categories){if(S.categories.some(o=>norms(o)===norms(c)))skip.push({name:c,why:'موجود عندك'});else add.push(c);}
    plan.groups.push({k:'categories',label:'التصنيفات',add,skip});}
  if(d.methods){const add=[],skip=[];
    for(const m of d.methods){if(S.methods.some(o=>norms(o.name)===norms(m.name)))skip.push({name:m.name,why:'موجودة عندك'});else add.push(m.name);}
    plan.groups.push({k:'methods',label:'وسائل الدفع',add,skip});}
  if(d.cities){const add=[],skip=[];
    for(const c of d.cities){if(S.cities.some(o=>norms(o)===norms(c)))skip.push({name:c,why:'موجودة عندك'});else add.push(c);}
    plan.groups.push({k:'cities',label:'المدن',add,skip});}
  if(d.typeWords){const add=[],skip=[];
    for(const [g,ws] of Object.entries(d.typeWords))for(const w of ws){
      if((S.typeWords[g]||[]).some(o=>norms(o)===norms(w)))skip.push({name:w,why:'موجودة عندك'});else add.push(w);}
    plan.groups.push({k:'typeWords',label:'كلمات أنواع الرسائل',add,skip});}
  return plan;}
function vImport(){
  const P=IMPS;const tot=P.groups.reduce((n,g)=>n+g.add.length,0);
  let x=`<section class="block"><h2>استيراد إعدادات</h2>
  <p class="note">ما ينحذف ولا يتغير شي عندك. اللي موجود عندك يُترك كما هو، واللي جديد ينضاف.</p>
  <div class="hero"><div class="big">${tot}</div><div class="muted">عنصر جديد بينضاف</div></div>
  <div class="actions"><button class="btn" onclick="applySettings()">أضف الجديد</button><button class="btn ghost" onclick="IMPS=null;go('settings')">إلغاء</button></div></section>`;
  for(const g of P.groups){if(!g.add.length&&!g.skip.length)continue;
    x+=`<section class="block"><h2>${h(g.label)}</h2>`;
    if(g.add.length)x+=`<div class="muted small">بينضاف (${g.add.length}):</div><div class="chipsrow">${g.add.map(n=>`<span class="chip on">${h(n)}</span>`).join('')}</div>`;
    if(g.skip.length)x+=`<div class="muted small">ما بينحفظ (${g.skip.length}):</div>`+g.skip.map(o=>`<div class="kv"><span>${h(o.name)}</span><span class="muted small">${h(o.why)}</span></div>`).join('');
    x+='</section>';}
  return x;}
function applySettings(){
  const d=IMPS.data;const norms=x=>norm(x||'').trim();
  if(d.categories)for(const c of d.categories)if(!S.categories.some(o=>norms(o)===norms(c)))S.categories.push(c);
  if(d.cities)for(const c of d.cities)if(!S.cities.some(o=>norms(o)===norms(c)))S.cities.push(c);
  if(d.methods)for(const m of d.methods)if(!S.methods.some(o=>norms(o.name)===norms(m.name)))S.methods.push({id:uid(),name:m.name,syns:(m.syns||[]).slice()});
  if(d.typeWords)for(const [g,ws] of Object.entries(d.typeWords)){S.typeWords[g]=S.typeWords[g]||[];
    for(const w of ws)if(!S.typeWords[g].some(o=>norms(o)===norms(w)))S.typeWords[g].push(w);}
  if(d.merchants)for(const m of d.merchants){
    if(S.merchants.some(o=>norms(o.name)===norms(m.name)))continue;
    if(S.merchants.some(o=>o.raws.some(r=>(m.raws||[]).includes(r))))continue;
    S.merchants.push({id:uid(),name:m.name,category:m.category||'',raws:(m.raws||[]).slice(),rawsText:(m.rawsText||[]).slice(),own:!!m.own});}
  if(d.banks){for(const b of d.banks)if(!S.banks.some(o=>norms(o.name)===norms(b.name)))S.banks.push({id:uid(),name:b.name,keywords:(b.keywords||[]).slice()});
    for(const t of (d.templates||[])){const bk=S.banks.find(o=>norms(o.name)===norms(t.bank));if(!bk)continue;
      const sig=tplSig(t);
      if(S.templates.some(o=>o.bankId===bk.id&&tplSig(o)===sig))continue;
      S.templates.push({id:uid(),bankId:bk.id,type:t.type,fields:t.fields,dateOrder:t.dateOrder,first:t.first});}}
  save('استيراد إعدادات');IMPS=null;toast('انضافت الإعدادات الجديدة');go('settings');}
function showUsage(){const el=$('#usage');if(!el||!navigator.storage||!navigator.storage.estimate)return;
  navigator.storage.estimate().then(e=>{const mb=x=>(x/1048576).toFixed(1);el.textContent='المساحة المستخدمة: '+mb(e.usage||0)+' ميقا من '+(e.quota?mb(e.quota)+' ميقا متاحة للتطبيق':'غير معروف');}).catch(()=>{});}

if(S.pin)LOCKED=true;
render();
lockGate();
/* ترحيل لمرة واحدة: «مدى» و«أثير» ما عادت مرادفات لـ«مدى باي»، صار لها وسيلة مستقلة.
   العمليات المحفوظة تبقى على وسيلتها، والتغيير على القاموس فقط */
function migrateMada(){
  if(S.madaSplit)return;
  const bad=['mada','مدى','مدى-أثير','mada atheer','أثير','اثير'].map(x=>norm(x).trim());
  const pay=S.methods.find(m=>norm(m.name).trim()===norm('مدى باي').trim());
  const moved=pay?pay.syns.filter(x=>bad.includes(norm(x).trim())):[];
  if(pay)pay.syns=pay.syns.filter(x=>!bad.includes(norm(x).trim()));
  let card=S.methods.find(m=>norm(m.name).trim()===norm('بطاقة مدى (تمرير)').trim());
  if(!card&&(moved.length||pay)){card={id:uid(),name:'بطاقة مدى (تمرير)',syns:[]};S.methods.push(card);}
  if(card)for(const x of ['mada','مدى','مدى-أثير','mada atheer','أثير','اثير'])
    if(!card.syns.some(y=>norm(y).trim()===norm(x).trim()))card.syns.push(x);
  S.madaSplit=1;writeLS();}
migrateMada();
dropCashCat();
cleanOrphans();
